<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">WildEpiPred model pipeline</title>
  <desc id="d">Bisulfite methylome data of O. rufipogon and Ae. tauschii give 41-bp 5mC positive and CDS-rule negative windows; CD-HIT-EST cluster-disjoint split; feature encoding (NCP, GC content, binary, oligonucleotide frequency, PSTNPss, EIIP, DNABERT-6); entropy-based and stepwise-regression feature selection; Random Forest, XGBoost and LightGBM on selected features, fine-tuned DNABERT and DNABERT-BiLSTM on sequence; optimised ensemble giving 5mC or non-5mC.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <style>
      .stage { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: #1f5e4a; }
      .h { font-size: 15px; font-weight: 700; fill: #1b1f1c; }
      .t { font-size: 13px; fill: #3d4540; }
      .s { font-size: 12px; fill: #6b746f; }
      .chip { font-size: 13px; fill: #1b1f1c; }
      .ln { stroke: #52514e; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="600" rx="18" fill="#ffffff"/>

  <!-- stage labels -->
  <text class="stage" x="30" y="40">1 · DATA</text>
  <text class="stage" x="250" y="40">2 · SPLIT</text>
  <text class="stage" x="450" y="40">3 · ENCODING</text>
  <text class="stage" x="665" y="40">4 · SELECTION</text>
  <text class="stage" x="865" y="40">5 · MODELS</text>
  <text class="stage" x="1060" y="40">6 · ENSEMBLE</text>

  <!-- 1 data -->
  <rect x="30" y="58" width="190" height="96" rx="12" fill="#e6f2ec" stroke="#2f7d63" stroke-width="1.2"/>
  <text class="h" x="46" y="86">Methylome data</text>
  <text class="t" x="46" y="108">Bisulfite sequencing</text>
  <text class="t" x="46" y="127" font-style="italic">O. rufipogon</text>
  <text class="t" x="46" y="145" font-style="italic">Ae. tauschii</text>

  <rect x="30" y="182" width="190" height="96" rx="12" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/>
  <text class="h" x="46" y="209">Positives: 5mC</text>
  <text class="t" x="46" y="231">CG + CHG + CHH</text>
  <text class="t" x="46" y="250">as one class</text>
  <text class="s" x="46" y="268">p &lt; 0.01, level ≥ 0.5, ≥ 5×</text>

  <rect x="30" y="296" width="190" height="96" rx="12" fill="#e9f1fb" stroke="#2a78d6" stroke-width="1.2"/>
  <text class="h" x="46" y="323">Negatives</text>
  <text class="t" x="46" y="345">CDS windows, C at centre</text>
  <text class="t" x="46" y="364">CHG motif, &lt; 60% identity</text>
  <text class="s" x="46" y="382">no methylated read</text>

  <rect x="30" y="420" width="190" height="62" rx="12" fill="#f3f2ee" stroke="#9a9890" stroke-width="1.2"/>
  <text class="h" x="46" y="446">41-bp windows</text>
  <text class="t" x="46" y="467">C at position 21</text>
  <path class="ln" d="M125 154 V176" marker-end="url(#ah)"/>
  <path class="ln" d="M125 392 V414" marker-end="url(#ah)"/>

  <!-- 2 split -->
  <rect x="250" y="58" width="170" height="424" rx="12" fill="#f7f7f4" stroke="#c9c7c0" stroke-width="1.2"/>
  <text class="h" x="266" y="86">Cluster-disjoint</text>
  <text class="h" x="266" y="105">split</text>
  <text class="t" x="266" y="134">CD-HIT-EST</text>
  <text class="s" x="266" y="153">90% redundancy removal</text>
  <text class="s" x="266" y="171">80% clusters → train / test</text>
  <rect x="266" y="194" width="138" height="56" rx="9" fill="#ffffff" stroke="#c9c7c0"/>
  <text class="chip" x="280" y="217" font-weight="700">Training 80%</text>
  <text class="s" x="280" y="237">incl. 10% validation</text>
  <rect x="266" y="262" width="138" height="56" rx="9" fill="#ffffff" stroke="#c9c7c0"/>
  <text class="chip" x="280" y="285" font-weight="700">Independent</text>
  <text class="chip" x="280" y="303" font-weight="700">test 20%</text>
  <text class="s" x="266" y="346">No test sequence ≥ 80%</text>
  <text class="s" x="266" y="364">identical to training</text>
  <text class="s" x="266" y="382">(both strands)</text>
  <path class="ln" d="M220 451 H236 V270 H244" marker-end="url(#ah)"/>

  <!-- 3 encoding -->
  <rect x="450" y="58" width="185" height="424" rx="12" fill="#f7f7f4" stroke="#c9c7c0" stroke-width="1.2"/>
  <text class="h" x="466" y="86">Feature encoding</text>
  <g>
    <rect x="466" y="102" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="124">NCP</text>
    <rect x="466" y="144" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="166">GC content</text>
    <rect x="466" y="186" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="208">Binary encoding</text>
    <rect x="466" y="228" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="250">ONF (k = 1–4)</text>
    <rect x="466" y="270" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="292">PSTNPss</text>
    <rect x="466" y="312" width="153" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="478" y="334">EIIP</text>
    <rect x="466" y="354" width="153" height="34" rx="8" fill="#e6f2ec" stroke="#2f7d63"/><text class="chip" x="478" y="376">DNABERT-6</text>
  </g>
  <text class="s" x="466" y="414">1,476 dimensions</text>
  <text class="s" x="466" y="432">(708 handcrafted +</text>
  <text class="s" x="466" y="450">768 DNABERT)</text>
  <path class="ln" d="M420 230 H444" marker-end="url(#ah)"/>

  <!-- 4 selection -->
  <rect x="665" y="58" width="170" height="250" rx="12" fill="#f7f7f4" stroke="#c9c7c0" stroke-width="1.2"/>
  <text class="h" x="681" y="86">Feature selection</text>
  <rect x="681" y="102" width="138" height="62" rx="9" fill="#ffffff" stroke="#c9c7c0"/>
  <text class="chip" x="693" y="126" font-weight="700">Entropy-based</text>
  <text class="s" x="693" y="146">mutual info., top 200</text>
  <path class="ln" d="M750 164 V182" marker-end="url(#ah)"/>
  <rect x="681" y="188" width="138" height="62" rx="9" fill="#ffffff" stroke="#c9c7c0"/>
  <text class="chip" x="693" y="212" font-weight="700">Stepwise</text>
  <text class="s" x="693" y="232">regression (BIC)</text>
  <text class="s" x="681" y="282">28–32 features kept</text>
  <path class="ln" d="M635 180 H659" marker-end="url(#ah)"/>

  <!-- 5 models -->
  <rect x="865" y="58" width="170" height="250" rx="12" fill="#f7f7f4" stroke="#c9c7c0" stroke-width="1.2"/>
  <text class="h" x="881" y="86">Machine learning</text>
  <rect x="881" y="102" width="138" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="893" y="124">Random Forest</text>
  <rect x="881" y="144" width="138" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="893" y="166">XGBoost</text>
  <rect x="881" y="186" width="138" height="34" rx="8" fill="#ffffff" stroke="#c9c7c0"/><text class="chip" x="893" y="208">LightGBM</text>
  <text class="s" x="881" y="252">Optuna-tuned on</text>
  <text class="s" x="881" y="270">validation AUROC</text>
  <path class="ln" d="M835 180 H859" marker-end="url(#ah)"/>

  <rect x="865" y="330" width="170" height="152" rx="12" fill="#e6f2ec" stroke="#2f7d63" stroke-width="1.2"/>
  <text class="h" x="881" y="358">Deep learning</text>
  <rect x="875" y="374" width="152" height="34" rx="8" fill="#ffffff" stroke="#2f7d63"/><text class="chip" x="886" y="396" font-size="12">Fine-tuned DNABERT</text>
  <rect x="875" y="416" width="152" height="34" rx="8" fill="#ffffff" stroke="#2f7d63"/><text class="chip" x="886" y="438" font-size="12">DNABERT-BiLSTM</text>
  <text class="s" x="881" y="470">sequence-based</text>
  <!-- sequence path to deep learning (bypasses feature selection) -->
  <path class="ln" d="M420 515 H850 V420 H859" marker-end="url(#ah)"/>
  <path class="ln" d="M335 482 V515 H420"/>
  <text class="s" x="560" y="507">41-bp sequence</text>

  <!-- 6 ensemble -->
  <rect x="1060" y="150" width="120" height="182" rx="12" fill="#1f5e4a"/>
  <text x="1120" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Optimised</text>
  <text x="1120" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ensemble</text>
  <text x="1120" y="238" text-anchor="middle" font-size="12" fill="#cfe7dc">weights minimise</text>
  <text x="1120" y="255" text-anchor="middle" font-size="12" fill="#cfe7dc">validation</text>
  <text x="1120" y="272" text-anchor="middle" font-size="12" fill="#cfe7dc">log-loss</text>
  <text x="1120" y="304" text-anchor="middle" font-size="12" fill="#cfe7dc">one model</text>
  <text x="1120" y="320" text-anchor="middle" font-size="12" fill="#cfe7dc">per species</text>
  <path class="ln" d="M1035 183 H1054" marker-end="url(#ah)"/>
  <path class="ln" d="M1035 406 H1046 V300 H1054" marker-end="url(#ah)"/>

  <!-- output -->
  <path class="ln" d="M1120 332 V380" marker-end="url(#ah)"/>
  <rect x="1060" y="386" width="120" height="44" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="1.2"/>
  <text x="1120" y="413" text-anchor="middle" font-size="14" font-weight="700" fill="#b8481c">5mC</text>
  <rect x="1060" y="438" width="120" height="44" rx="10" fill="#e9f1fb" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="1120" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5ea8">non-5mC</text>
  <text class="s" x="30" y="566">5mC = 5-methylcytosine; NCP = nucleotide chemical property; ONF = oligonucleotide frequency; PSTNPss = position-specific trinucleotide propensity (single strand);</text>
  <text class="s" x="30" y="584">EIIP = electron–ion interaction potential; BIC = Bayesian information criterion.</text>
</svg>
